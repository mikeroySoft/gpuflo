[package]
name = "gpuflo"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Read-only terminal instrument for Linux amdgpu GPUs: activity, memory occupancy, and source-backed health within one second"
repository = "https://github.com/mikeroysoft/gpuflo"
license = "MIT"
readme = "README.md"
keywords = ["amd", "gpu", "amdgpu", "telemetry", "tui"]
categories = ["command-line-utilities", "visualization"]
include = ["/src", "/LICENSE", "/README.md", "/THIRD_PARTY_NOTICES.txt"]

[dependencies]
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
lexopt = "0.3.2"
libloading = "0.8.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "local-offset"] }
toml = "0.9.12"
unicode-width = "0.2.2"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
libc = "0.2.189"
