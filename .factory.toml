# agent-factory configuration. Docs: https://github.com/mikeroySoft/agent-factory

[repo]
# Not a fork: no upstream sync.

[dispatch]
max_active = 2
max_attempts = 3

[gate]
[[gate.check]]
name = "fmt"
run = ["cargo", "fmt", "--check"]

[[gate.check]]
name = "clippy"
run = ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"]
exclusive = true

[[gate.check]]
name = "tests"
run = ["cargo", "test", "--all-targets", "--locked"]
exclusive = true

[[gate.check]]
name = "notices"
run = ["sh", "-c", "python3 scripts/notices.py && git diff --exit-code THIRD_PARTY_NOTICES.txt"]

[leak_scan]
exclude = ["scripts/agent_gate.py"]

[dashboard]
theme = ".factory-dashboard.css"
