name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release:
    name: build and publish the x86_64 archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      # The deterministic release gate reruns on the immutable tag.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: python3 scripts/notices.py && git diff --exit-code THIRD_PARTY_NOTICES.txt
      - run: cargo package --locked --allow-dirty
      - name: verify MSRV
        run: |
          rustup toolchain install 1.96 --profile minimal
          cargo +1.96 build --all-targets --locked
          cargo +1.96 test --lib --locked

      - name: build the release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: assemble the archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v${PACKAGE_VERSION}" = "${VERSION}" \
            || { echo "tag ${VERSION} does not match Cargo.toml"; exit 1; }
          MANIFEST="validation/${PACKAGE_VERSION}.md"
          test -f "${MANIFEST}" \
            || { echo "missing ${MANIFEST}"; exit 1; }
          grep -Fx "Release authorization: qualified" "${MANIFEST}" \
            || { echo "${MANIFEST} does not authorize a qualified release"; exit 1; }
          grep -Fx -- "- Version: ${PACKAGE_VERSION}" "${MANIFEST}" \
            || { echo "${MANIFEST} version does not match"; exit 1; }
          grep -Fx -- "- Commit: ${GITHUB_SHA}" "${MANIFEST}" \
            || { echo "${MANIFEST} commit does not match tag checkout"; exit 1; }
          NAME="gruflo-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir staging
          cp target/x86_64-unknown-linux-gnu/release/gruflo \
             LICENSE THIRD_PARTY_NOTICES.txt README.md staging/
          tar -C staging -czf "${NAME}.tar.gz" \
            gruflo LICENSE THIRD_PARTY_NOTICES.txt README.md
          sha256sum "${NAME}.tar.gz" > SHA256SUMS
          MAX_GLIBC="$(objdump -T staging/gruflo \
            | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n1)"
          test -n "${MAX_GLIBC}"
          grep -Fx -- "- Maximum required GLIBC: ${MAX_GLIBC}" "${MANIFEST}" \
            || { echo "${MANIFEST} glibc baseline does not match ${MAX_GLIBC}"; exit 1; }
          {
            echo "Maximum required symbol version: ${MAX_GLIBC}"
            ldd --version | sed -n '1p'
            file staging/gruflo
            readelf -d staging/gruflo | grep NEEDED || true
          } > GLIBC_BASELINE.txt
          # The archived binary must identify the release, and the archive
          # root must contain exactly the four distributable files.
          staging/gruflo --version | grep -F "${VERSION#v}"
          test "$(tar -tzf "${NAME}.tar.gz" | sort | paste -sd ' ' -)" = \
            "LICENSE README.md THIRD_PARTY_NOTICES.txt gruflo"

      - name: publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            gruflo-*.tar.gz
            SHA256SUMS
            GLIBC_BASELINE.txt
            validation/*.md

      # crates.io publication stays a manual, credentialed step:
      # cargo publish --locked
